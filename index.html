<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Editor Novel Detektif Pribadi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121214; 
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 1000px; 
            margin: auto; 
        }
        h1 { 
            color: #ff3333; 
            text-align: center; 
            font-family: 'Courier New', Courier, monospace; 
            letter-spacing: 2px; 
            margin-bottom: 5px; 
        }
        p.subtitle { text-align: center; color: #888; margin-bottom: 25px; }
        
        /* Wadah Kotak Pembungkus Bot AI agar Rapi */
        .ai-frame-container {
            width: 100%;
            height: 650px; /* Tinggi layar aplikasi chat */
            border: 2px solid #3d3d5c;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1a1a24;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>🕵️ AI DETECTIVE STORY EDITOR</h1>
    <p class="subtitle">Aplikasi Menulis Novel Sinkronisasi Otak AI Poe (Bebas Error & Bebas Koding Lambat)</p>

    <!-- Kotak Aplikasi Chat Poe Kamu -->
    <div class="ai-frame-container">
        <!-- Tautan ini sudah otomatis mengarah langsung ke bot EditorNovelDetektif milikmu -->
        <iframe src="https://poe.com"></iframe>
    </div>

</body>
</html>
